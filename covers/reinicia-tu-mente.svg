<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420">
  <defs>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="50%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="300" height="420" fill="#fdfbf7" rx="8" filter="url(#shadow)"/>
  
  <!-- Borde sutil -->
  <rect x="1" y="1" width="298" height="418" fill="none" stroke="#e5e5e5" stroke-width="1" rx="7"/>

  <!-- Autor -->
  <text x="150" y="32" text-anchor="middle" fill="#333333" font-family="'Inter', sans-serif" font-size="11" font-weight="500" letter-spacing="1">Begoña del Campo Zafra</text>

  <!-- Título -->
  <text x="150" y="72" text-anchor="middle" fill="#111111" font-family="'Inter', Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="2">REINICIA</text>
  <text x="150" y="105" text-anchor="middle" fill="#222222" font-family="'Inter', Arial, sans-serif" font-size="26" font-weight="300" letter-spacing="3">TU MENTE</text>

  <!-- Ilustración del cerebro estilizado -->
  <g transform="translate(150, 205)">
    <!-- Base cerebro con gradiente rosa -->
    <path d="M-65,-40 C-75,-25 -80,-5 -75,15 C-70,35 -55,50 -35,55 C-25,65 -5,70 10,65 C30,70 50,60 65,45 C75,30 80,10 75,-15 C70,-35 55,-50 35,-55 C20,-60 -5,-60 -25,-55 C-45,-55 -60,-50 -65,-40 Z" fill="url(#brainGrad)" opacity="0.9"/>
    
    <!-- Red geométrica / neuronal interna -->
    <path d="M-45,-25 L-20,-35 L10,-40 L40,-25 L55,0 L40,30 L10,45 L-25,40 L-50,20 Z" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <path d="M-20,-35 L-5,-10 L30,-15 L40,10 L15,25 L-15,15 L-35,-5 Z" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
    <line x1="-5" y1="-10" x2="10" y2="45" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <line x1="-45" y1="-25" x2="-5" y2="-10" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <line x1="40" y1="-25" x2="30" y2="-15" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <line x1="55" y1="0" x2="40" y2="10" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <line x1="-50" y1="20" x2="-15" y2="15" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <line x1="-35" y1="55" x2="-25" y2="40" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>

    <!-- Nodos neuronales -->
    <circle cx="-5" cy="-10" r="5" fill="#ffffff"/>
    <circle cx="30" cy="-15" r="4" fill="#ffffff"/>
    <circle cx="-20" cy="-35" r="3.5" fill="#ffffff"/>
    <circle cx="40" cy="10" r="4" fill="#ffffff"/>
    <circle cx="15" cy="25" r="4.5" fill="#ffffff"/>
    <circle cx="-15" cy="15" r="4" fill="#ffffff"/>
    <circle cx="-35" cy="-5" r="3.5" fill="#ffffff"/>
    <circle cx="10" cy="-40" r="3" fill="#ffffff"/>
    <circle cx="40" cy="-25" r="3" fill="#ffffff"/>

    <!-- Destellos / Estrellas -->
    <path d="M-25,-15 L-23,-10 L-18,-8 L-23,-6 L-25,-1 L-27,-6 L-32,-8 L-27,-10 Z" fill="#ffffff"/>
    <path d="M25,5 L26.5,8.5 L30,10 L26.5,11.5 L25,15 L23.5,11.5 L20,10 L23.5,8.5 Z" fill="#ffffff"/>
    <path d="M5,-25 L6,-22 L9,-21 L6,-20 L5,-17 L4,-20 L1,-21 L4,-22 Z" fill="#ffffff"/>

    <!-- Ícono Reset debajo del cerebro -->
    <g transform="translate(0, 75)">
      <circle cx="0" cy="0" r="14" fill="#ffffff" filter="url(#shadow)"/>
      <path d="M-6,-2 A7,7 0 1,1 0,7" fill="none" stroke="#ec4899" stroke-width="2.2" stroke-linecap="round"/>
      <polygon points="-6,-6 -6,0 0,-1" fill="#ec4899"/>
    </g>
  </g>

  <!-- Subtítulo -->
  <text x="150" y="325" text-anchor="middle" fill="#111111" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="700">Reprograma tu subconsciente</text>
  <text x="150" y="342" text-anchor="middle" fill="#111111" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="700">y libera la mejor versión de ti</text>

  <!-- Editorial kitaeru -->
  <g transform="translate(150, 385)">
    <!-- Logo círculos enlazados -->
    <circle cx="-7" cy="-8" r="4" fill="none" stroke="#222222" stroke-width="1"/>
    <circle cx="0" cy="-10" r="4.5" fill="none" stroke="#222222" stroke-width="1"/>
    <circle cx="7" cy="-8" r="4" fill="none" stroke="#222222" stroke-width="1"/>
    <circle cx="-4" cy="-4" r="4" fill="none" stroke="#222222" stroke-width="1"/>
    <circle cx="4" cy="-4" r="4" fill="none" stroke="#222222" stroke-width="1"/>
    <text x="0" y="8" text-anchor="middle" fill="#222222" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1">kitaeru</text>
  </g>
</svg>