<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D2E"/>
      <stop offset="50%" stop-color="#12081F"/>
      <stop offset="100%" stop-color="#0A0412"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C07B"/>
      <stop offset="100%" stop-color="#D19A66"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B66AFF"/>
      <stop offset="100%" stop-color="#8E3EE8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#B66AFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgGrad)"/>
  <rect width="400" height="600" fill="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="15" y="15" width="370" height="570" fill="none" stroke="url(#violetGrad)" stroke-width="1.5" stroke-opacity="0.5" rx="10"/>
  <rect x="22" y="22" width="356" height="556" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-opacity="0.3" rx="8"/>

  <!-- Top Brand Header -->
  <rect x="110" y="38" width="180" height="22" rx="11" fill="#B66AFF" fill-opacity="0.15" stroke="#B66AFF" stroke-width="1" stroke-opacity="0.4"/>
  <text x="200" y="53" text-anchor="middle" fill="#B66AFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="2">BIBLIOTYAN &#8226; PSICOLOGÍA</text>

  <!-- Emblem: Psychological Influence & Persuasion -->
  <circle cx="200" cy="180" r="58" fill="#21172C" stroke="url(#violetGrad)" stroke-width="2.5"/>
  <circle cx="200" cy="180" r="48" fill="none" stroke="#E5C07B" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4,4"/>

  <!-- Stylized Brain / Node / Magnet symbol -->
  <path d="M175 160 C165 170, 165 190, 175 200 C185 210, 200 205, 200 195 C200 205, 215 210, 225 200 C235 190, 235 170, 225 160 C215 150, 185 150, 175 160 Z" fill="none" stroke="#B66AFF" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="185" cy="175" r="4" fill="#E5C07B"/>
  <circle cx="215" cy="175" r="4" fill="#E5C07B"/>
  <circle cx="200" cy="165" r="3.5" fill="#FFFFFF"/>
  <circle cx="200" cy="188" r="4" fill="#B66AFF"/>
  <line x1="185" y1="175" x2="200" y2="165" stroke="#B66AFF" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="215" y1="175" x2="200" y2="165" stroke="#B66AFF" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="185" y1="175" x2="200" y2="188" stroke="#B66AFF" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="215" y1="175" x2="200" y2="188" stroke="#B66AFF" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Main Title -->
  <text x="200" y="295" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="4">INFLUENCIA</text>

  <!-- Subtitle -->
  <text x="200" y="335" text-anchor="middle" fill="#E5C07B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="1.5">La Psicología de la Persuasión</text>

  <!-- Divider line -->
  <line x1="110" y1="365" x2="290" y2="365" stroke="url(#violetGrad)" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="200" cy="365" r="3" fill="#E5C07B"/>

  <!-- 6 Principles Mini Pills -->
  <text x="200" y="398" text-anchor="middle" fill="#D4B8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="1">LOS 6 PRINCIPIOS UNIVERSALES</text>
  <text x="200" y="418" text-anchor="middle" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400">Reciprocidad &#8226; Compromiso &#8226; Prueba Social</text>
  <text x="200" y="434" text-anchor="middle" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400">Simpatía &#8226; Autoridad &#8226; Escasez</text>

  <!-- Author Section -->
  <text x="200" y="500" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="2">ROBERT B. CIALDINI, PH.D.</text>
  <text x="200" y="522" text-anchor="middle" fill="#c77dff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Obra Maestra del Comportamiento Humano</text>

  <!-- Footer Badge -->
  <rect x="135" y="546" width="130" height="20" rx="4" fill="#0A0412" stroke="#B66AFF" stroke-width="1" stroke-opacity="0.3"/>
  <text x="200" y="560" text-anchor="middle" fill="#D4B8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.5">EDICIÓN COMPLETA</text>
</svg>